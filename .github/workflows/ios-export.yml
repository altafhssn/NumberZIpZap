name: Build iOS and TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-export-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2
  GODOT_RELEASE: stable
  GODOT_TEMPLATE_DIR: 4.6.2.stable

jobs:
  export-xcode-project:
    name: Godot iOS export
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-ci
            ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}
          key: godot-macos-${{ env.GODOT_VERSION }}-ios

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_HOME="$HOME/godot-ci"
          GODOT_APP="$GODOT_HOME/Godot.app"
          GODOT_BIN="$GODOT_APP/Contents/MacOS/Godot"
          TEMPLATE_HOME="$HOME/Library/Application Support/Godot/export_templates/$GODOT_TEMPLATE_DIR"

          mkdir -p "$GODOT_HOME" "$TEMPLATE_HOME"

          if [[ ! -x "$GODOT_BIN" ]]; then
            curl --fail --location --retry 3 \
              --output "$RUNNER_TEMP/godot.zip" \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_macos.universal.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$GODOT_HOME"
            chmod +x "$GODOT_BIN"
            xattr -dr com.apple.quarantine "$GODOT_APP" 2>/dev/null || true
          fi

          if [[ ! -f "$TEMPLATE_HOME/ios.zip" ]]; then
            curl --fail --location --retry 3 \
              --output "$RUNNER_TEMP/templates.tpz" \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
            rm -rf "$RUNNER_TEMP/godot-templates"
            unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
            cp -R "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_HOME/"
          fi

          echo "$GODOT_APP/Contents/MacOS" >> "$GITHUB_PATH"

      - name: Show tool versions
        shell: bash
        run: |
          Godot --version
          xcodebuild -version

      - name: Import Godot resources
        shell: bash
        run: Godot --headless --editor --path "$GITHUB_WORKSPACE" --import

      - name: Export Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build/ios"
          mkdir -p "$GITHUB_WORKSPACE/build/ios"

          # The Android-only Play Games editor plugin may make Godot return 1
          # while shutting down on macOS because no ADB daemon is available.
          # The iOS export itself is valid when the expected ZIP was produced.
          set +e
          Godot --headless --path "$GITHUB_WORKSPACE" \
            --export-release "iOS" "$GITHUB_WORKSPACE/build/ios/ZipPath"
          godot_status=$?
          set -e

          test -s "$GITHUB_WORKSPACE/build/ios/ZipPath.xcodeproj/project.pbxproj"
          if [[ $godot_status -ne 0 ]]; then
            echo "Godot exited with $godot_status after creating the iOS export; continuing."
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$GITHUB_WORKSPACE/build/ios" \
            "$GITHUB_WORKSPACE/build/ZipPath-iOS-Xcode-project.zip"
          test -s "$GITHUB_WORKSPACE/build/ZipPath-iOS-Xcode-project.zip"

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ZipPath-iOS-Xcode-project
          path: build/ZipPath-iOS-Xcode-project.zip
          if-no-files-found: error
          retention-days: 7

      - name: Install Apple signing credentials
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_UUID: ${{ secrets.PROVISIONING_PROFILE_UUID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY_BASE64"
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$BUILD_PROVISION_PROFILE_BASE64"
          test -n "$PROVISIONING_PROFILE_UUID"
          test -n "$APPLE_TEAM_ID"
          test -n "$IOS_BUNDLE_ID"

          key_dir="$RUNNER_TEMP/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          openssl pkey -in "$key_path" -noout
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

          certificate_path="$RUNNER_TEMP/ZipPath_Distribution.p12"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_path="$profile_dir/$PROVISIONING_PROFILE_UUID.mobileprovision"
          keychain_path="$RUNNER_TEMP/ZipPath-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          mkdir -p "$profile_dir"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security default-keychain -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$GITHUB_WORKSPACE/build/ios/ZipPath.xcodeproj" \
            -scheme ZipPath \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/ZipPath.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            MARKETING_VERSION=1.12 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export signed IPA
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key>
              <string>$PROFILE_SPECIFIER</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          rm -rf "$GITHUB_WORKSPACE/build/ipa"
          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ZipPath.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          ipa_path="$(find "$GITHUB_WORKSPACE/build/ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          test -s "$ipa_path"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipPath-iOS-signed-IPA
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
